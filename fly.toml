# Fly.io (https://fly.io): `fly launch --no-deploy`, `fly volumes create ryuhai_data --size 1`, `fly secrets set ADMIN_KEY=choose-a-key`, `fly deploy`
app = "ryuhai"          # change to a unique name
primary_region = "sin"  # pick the region closest to your players

[build]

[env]
  PORT = "3000"

[mounts]
  source = "ryuhai_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
